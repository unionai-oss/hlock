[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "hlock"
# Read by maturin from the Cargo workspace ([workspace.package].version), the single
# source of truth. Bump it with `python scripts/set_version.py X.Y.Z`.
dynamic = ["version"]
description = "Make your agent harness pinnable, portable, and tunable: pin its models, MCP servers, skills, and config in a harness.lock, rehydrate it anywhere, then tune it against your own tasks."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Niels Bantilan", email = "niels.bantilan@gmail.com" }]
keywords = ["agents", "evaluation", "llm", "lockfile", "tuning", "rust", "flyte"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "rich-click>=1.8",
]

[project.urls]
Homepage = "https://github.com/unionai-oss/hlock"
Documentation = "https://docs.hlock.ai/"
Source = "https://github.com/unionai-oss/hlock"
Issues = "https://github.com/unionai-oss/hlock/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
flyte = [
    # The `flyte` backend runs each work item as a Flyte 2 task.
    "flyte>=2.0; python_version >= '3.10'",
    # flyteplugins-rs registers Rust-backed tasks with a Flyte backend.
    "flyteplugins-rs; python_version >= '3.10'",
]

[dependency-groups]
# `uv sync` installs `dev` by default; add `--group docs` for the docs toolchain.
dev = [
    "maturin>=1.5,<2.0",
    "prek>=0.5.5",
    "pytest>=7.0",
    "ruff",
]
docs = [
    # Zensical is pre-1.0 (pin it, bump deliberately) and needs Python 3.11+.
    "zensical==0.0.71; python_version >= '3.11'",
]

[project.scripts]
hlock = "hlock.cli:main"
harness-lock = "hlock.cli:main"

# Backends are found by name in this group (see hlock.backends); the built-ins are
# registered the same way a third-party backend is.
[project.entry-points."hlock.backends"]
local = "hlock.backends.local:LocalBackend"
flyte = "hlock.backends.flyte:FlyteBackend"
harness2 = "hlock.backends.harness2:Harness2Backend"

# The wheel ships two importable packages: `hlock` (the implementation, with the
# compiled `hlock._hlock` module) and `harness_lock` (a re-export shim, so
# `import harness_lock` matches the alias name). The `harness-lock` PyPI name is a
# code-free alias in packaging/harness-lock that pins this package.
[tool.maturin]
manifest-path = "crates/harness-lock-py/Cargo.toml"
module-name = "hlock._hlock"
python-source = "."
python-packages = ["harness_lock"]

[tool.uv]
# Rebuild the Rust extension on `uv sync` / `uv run` whenever Rust sources change.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "crates/**/*.rs" },
    { file = "crates/**/Cargo.toml" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
