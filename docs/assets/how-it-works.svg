<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-label="How hlock works: hlock pin captures the setup you have, or hlock resolve searches, evaluates, and selects a stack from harness.toml and eval packs. Either way it writes harness.lock, which hlock check, sync, and launch use.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8b949e"/>
    </marker>
    <linearGradient id="lock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <style>
      .t  { font: 600 17px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6edf3; }
      .s  { font: 400 13.5px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8b949e; }
      .lb { font: 700 11.5px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: .12em; }
      .m  { font: 600 16px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #e6edf3; }
      .n  { font: 700 13px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0d1117; }
      .wire { stroke: #8b949e; stroke-width: 1.6; fill: none; }
    </style>
  </defs>

  <rect width="960" height="380" rx="18" fill="#0d1117"/>
  <rect x=".5" y=".5" width="959" height="379" rx="18" fill="none" stroke="#30363d"/>

  <!-- pin: the setup you have -->
  <text x="40" y="44" class="lb" fill="#8b949e">YOU HAVE</text>
  <rect x="40" y="60" width="230" height="78" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="62" y="94" class="m">your setup</text>
  <text x="62" y="118" class="s">harness · models · MCP · skills</text>

  <path class="wire" d="M270 99H318" marker-end="url(#arrow)"/>

  <text x="322" y="44" class="lb" fill="#22d3ee">HLOCK PIN</text>
  <rect x="322" y="60" width="320" height="78" rx="14" fill="#22d3ee" fill-opacity=".07" stroke="#22d3ee" stroke-opacity=".7"/>
  <text x="346" y="94" class="t">capture</text>
  <text x="346" y="118" class="s">digests · secrets → placeholders</text>

  <!-- resolve: a better one -->
  <text x="40" y="184" class="lb" fill="#8b949e">OR YOU DECLARE</text>
  <rect x="40" y="200" width="230" height="68" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="62" y="230" class="m">harness.toml</text>
  <text x="62" y="252" class="s">candidates · objective · budget</text>
  <rect x="40" y="282" width="230" height="68" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="62" y="312" class="m">eval packs</text>
  <text x="62" y="334" class="s">prompts · fixtures · graders</text>

  <path class="wire" d="M270 234H296V275H318" marker-end="url(#arrow)"/>
  <path class="wire" d="M270 316H296V275" />

  <text x="322" y="184" class="lb" fill="#a78bfa">HLOCK RESOLVE</text>
  <rect x="322" y="200" width="320" height="150" rx="14" fill="#a78bfa" fill-opacity=".07" stroke="#a78bfa" stroke-opacity=".7"/>
  <g>
    <circle cx="352" cy="228" r="11" fill="#a78bfa"/><text x="352" y="233" class="n" text-anchor="middle">1</text>
    <text x="376" y="226" class="t">search</text>
    <text x="376" y="244" class="s">LLMs × decision × harness × policy</text>
    <circle cx="352" cy="275" r="11" fill="#c084fc"/><text x="352" y="280" class="n" text-anchor="middle">2</text>
    <text x="376" y="273" class="t">evaluate</text>
    <text x="376" y="291" class="s">score every candidate on your evals</text>
    <circle cx="352" cy="322" r="11" fill="#f472b6"/><text x="352" y="327" class="n" text-anchor="middle">3</text>
    <text x="376" y="320" class="t">select</text>
    <text x="376" y="338" class="s">Pareto front + constraints</text>
  </g>

  <path class="wire" d="M642 99H668V170H690" marker-end="url(#arrow)"/>
  <path class="wire" d="M642 275H668V206H690" marker-end="url(#arrow)"/>

  <!-- lock -->
  <text x="694" y="128" class="lb" fill="#f472b6">YOU SHIP</text>
  <rect x="694" y="140" width="226" height="96" rx="14" fill="url(#lock)" fill-opacity=".16" stroke="url(#lock)" stroke-width="1.6"/>
  <text x="716" y="176" class="m">harness.lock</text>
  <text x="716" y="200" class="s">pinned · hashed · portable</text>
  <text x="716" y="219" class="s">plus evidence, if resolved</text>

  <path class="wire" d="M730 236V262" marker-end="url(#arrow)"/>
  <path class="wire" d="M806 236V262" marker-end="url(#arrow)"/>
  <path class="wire" d="M883 236V262" marker-end="url(#arrow)"/>
  <rect x="694" y="266" width="72" height="56" rx="12" fill="#161b22" stroke="#22c55e" stroke-opacity=".7"/>
  <text x="730" y="291" class="m" text-anchor="middle" style="font-size:13px">check</text>
  <text x="730" y="310" class="s" text-anchor="middle" style="font-size:11.5px">drift</text>
  <rect x="770" y="266" width="72" height="56" rx="12" fill="#161b22" stroke="#3b82f6" stroke-opacity=".7"/>
  <text x="806" y="291" class="m" text-anchor="middle" style="font-size:13px">sync</text>
  <text x="806" y="310" class="s" text-anchor="middle" style="font-size:11.5px">rehydrate</text>
  <rect x="846" y="266" width="74" height="56" rx="12" fill="#161b22" stroke="#f59e0b" stroke-opacity=".7"/>
  <text x="883" y="291" class="m" text-anchor="middle" style="font-size:13px">launch</text>
  <text x="883" y="310" class="s" text-anchor="middle" style="font-size:11.5px">run it</text>
</svg>
