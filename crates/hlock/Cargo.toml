[package]
name = "hlock"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Make your agent harness pinnable, portable, and tunable: tune your agent stack and pin it to harness.lock."
readme = "../../README.md"
homepage = "https://github.com/unionai-oss/hlock"
documentation = "https://docs.rs/hlock"
keywords = ["agents", "llm", "lockfile", "evaluation", "flyte"]
categories = ["development-tools", "command-line-utilities"]

[lib]
name = "hlock"

[dependencies]
# Exact pin: hlock X.Y.Z is always harness-lock-core X.Y.Z.
harness-lock-core = { path = "../harness-lock-core", version = "=0.2.0" }

[features]
default = []
# Durable, traced trial execution on a Flyte / Union backend.
flyte = ["harness-lock-core/flyte"]

[lints]
workspace = true
