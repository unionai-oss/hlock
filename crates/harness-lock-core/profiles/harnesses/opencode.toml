# Harness profile: OpenCode.
id = "opencode"
name = "OpenCode"
kind = "cli"
aliases = ["open-code", "sst-opencode"]
homepage = "https://opencode.ai"
support = "full"
open-source = true
local-models = true
binaries = ["opencode"]
version = { args = ["--version"] }
active-env = ["OPENCODE", "OPENCODE_SESSION_ID"]
# OpenCode reads $XDG_CONFIG_HOME/opencode, so isolation relocates XDG_CONFIG_HOME.
config-root = { env = "XDG_CONFIG_HOME", suffix = "opencode", default = "~/.config/opencode" }
instructions = ["AGENTS.md", "CLAUDE.md", "{root}/AGENTS.md"]
# subagents (`mode: subagent` in their frontmatter) and plugin files, project or user level;
# hlock's own decider plugin isn't the project's
subagents = { dirs = [".opencode/agent", ".opencode/agents", "{root}/agent", "{root}/agents"], ext = [".md"], write = ".opencode/agent", frontmatter = ["mode: subagent"] }
middleware = { dirs = [".opencode/plugin", ".opencode/plugins", "{root}/plugin", "{root}/plugins"], ext = [".ts", ".js"], write = ".opencode/plugin", format = "opencode-plugin", skip = ["hlock-deciders.js"] }

api-keys = [{ provider = "anthropic", env = "ANTHROPIC_API_KEY" }, { provider = "openai", env = "OPENAI_API_KEY" }, { provider = "google", env = "GOOGLE_GENERATIVE_AI_API_KEY" }]

[[install]]
method = "brew"
package = "opencode"
[[install]]
method = "npm"
package = "opencode-ai"
[[install]]
method = "script"
command = "curl -fsSL https://opencode.ai/install | bash"
path-hints = ["/.opencode/bin/"]

[files.config]
path = "{root}/opencode.json"
format = "jsonc"
restore = "whole"
# OpenCode substitutes {env:VAR} across the whole file's text before parsing it.
env-ref = "{env:{name}}"
[files.project]
path = "opencode.json"
format = "jsonc"
restore = "record"

[model]
default = ["env:OPENCODE_MODEL", "config#/model"]
small = ["config#/small_model"]
format = "provider/model"

[providers]
source = ["config#/provider"]
base-url = ["/options/baseURL", "/options/baseUrl"]
models = ["/models"]

[mcp]
sources = ["config#/mcp", "project#/mcp"]
write = "config#/mcp"
shape = "opencode"

[skills]
dirs = ["{root}/skills", "~/.agents/skills", ".opencode/skills", ".agents/skills", ".claude/skills"]
write = "{root}/skills"

[[bundles]]
kind = "plugin"
extractor = "npm-list"
source = "config#/plugin"

# How hlock wires decision models in: a plugin hlock writes and owns. Its
# tool.execute.before can only refuse a call.
[deciders.approve]
hook = { path = "{root}/plugins/hlock-deciders.js", events = ["tool.execute.before"], format = "opencode" }

[launch]
model-flag = "--model"
prompt = ["run", "{prompt}"]  # `hlock run`: one prompt, non-interactively
interactive = ["--prompt", "{prompt}"]  # `hlock meta run`: a session whose first message is the prompt

# How `hlock localize` points this harness at a local OpenAI-compatible endpoint.
[[local-provider]]
file = "config"
set = { "/provider/{provider}" = { npm = "@ai-sdk/openai-compatible", name = "{provider} (local)", options = { baseURL = "{base_url}" }, models = { "{model}" = {} } }, "/model" = "{provider}/{model}" }

# How `hlock meta` sets an API provider and model.
[[api-provider]]
file = "config"
set = { "/model" = "{provider}/{model}" }
