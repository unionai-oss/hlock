# Harness profile: OpenAI Codex CLI.
id = "codex"
name = "Codex CLI"
kind = "cli"
aliases = ["codex-cli", "openai-codex"]
vendor = "OpenAI"
homepage = "https://developers.openai.com/codex/cli"
support = "full"
open-source = true
local-models = true
binaries = ["codex"]
version = { args = ["--version"] }
active-env = ["CODEX_THREAD_ID", "CODEX_SANDBOX", "CODEX_MANAGED_BY_NPM", "CODEX_MANAGED_BY_BUN"]
config-root = { env = "CODEX_HOME", default = "~/.codex" }
instructions = ["AGENTS.md", "AGENTS.override.md", "{root}/AGENTS.md"]

[[install]]
method = "npm"
package = "@openai/codex"
[[install]]
method = "brew-cask"
package = "codex"

[files.config]
path = "{root}/config.toml"
format = "toml"
restore = "whole"

[model]
default = ["config#/model"]
provider = ["config#/model_provider"]
default-provider = "openai"

[providers]
source = ["config#/model_providers"]
base-url = ["/base_url"]

[mcp]
sources = ["config#/mcp_servers"]
write = "config#/mcp_servers"
shape = "codex"

[skills]
dirs = ["{root}/skills", "~/.agents/skills", ".agents/skills", ".codex/skills"]
write = "{root}/skills"
builtin-dirs = ["{root}/skills/.system"]

[launch]
model-flag = "--model"
prompt = ["exec", "{prompt}"]  # `hlock run`: one prompt, non-interactively

# How `hlock localize` points this harness at a local OpenAI-compatible endpoint.
[[local-provider]]
file = "config"
set = { "/model_providers/{provider}" = { name = "{provider} (local)", base_url = "{base_url}", wire_api = "chat" }, "/model_provider" = "{provider}", "/model" = "{model}" }
