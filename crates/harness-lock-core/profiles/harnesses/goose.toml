# Harness profile: Goose (Block).
id = "goose"
name = "Goose"
kind = "cli"
aliases = ["block-goose"]
vendor = "Block"
homepage = "https://block.github.io/goose"
support = "basic"
open-source = true
local-models = true
binaries = ["goose"]
version = { args = ["--version"] }
config-root = { env = "XDG_CONFIG_HOME", suffix = "goose", default = "~/.config/goose" }
instructions = [".goosehints", "AGENTS.md", "{root}/.goosehints"]

api-keys = [{ provider = "anthropic", env = "ANTHROPIC_API_KEY" }, { provider = "openai", env = "OPENAI_API_KEY" }, { provider = "google", env = "GOOGLE_API_KEY" }]

[[install]]
method = "brew"
package = "block-goose-cli"
[[install]]
method = "script"
command = "curl -fsSL https://github.com/block/goose/releases/download/stable/download_cli.sh | bash"

[files.config]
path = "{root}/config.yaml"
format = "yaml"
restore = "whole"

[model]
default = ["env:GOOSE_MODEL", "config#/GOOSE_MODEL"]
provider = ["env:GOOSE_PROVIDER", "config#/GOOSE_PROVIDER"]

[mcp]
sources = ["config#/extensions"]
write = "config#/extensions"
shape = "goose"

[skills]
dirs = ["~/.agents/skills", ".agents/skills"]
write = "~/.agents/skills"

# How `hlock localize` points this harness at a local OpenAI-compatible endpoint.
[[local-provider]]
file = "config"
set = { "/GOOSE_PROVIDER" = "openai", "/GOOSE_MODEL" = "{model}", "/OPENAI_HOST" = "{host}", "/OPENAI_BASE_PATH" = "v1/chat/completions" }

[launch]
prompt = ["run", "-t", "{prompt}"]  # `hlock run`: one prompt, non-interactively

# How `hlock meta` sets an API provider and model.
[[api-provider]]
file = "config"
set = { "/GOOSE_PROVIDER" = "{provider}", "/GOOSE_MODEL" = "{model}" }
