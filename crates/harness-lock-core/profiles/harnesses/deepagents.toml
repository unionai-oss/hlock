# Framework profile: Deep Agents (LangChain).
id = "deepagents"
name = "Deep Agents"
kind = "framework"
aliases = ["deep-agents", "langchain-deepagents"]
vendor = "LangChain"
homepage = "https://github.com/langchain-ai/deepagents"
packages = ["pypi:deepagents", "pypi:langchain", "pypi:langgraph"]
instructions = ["AGENTS.md"]
# a decider's System One endpoint, for the framework's own decision-model support
decider-env = [["TYPESAFE_BASE_URL", "TYPESAFE_API_KEY"]]
[skills]
dirs = ["skills", ".deepagents/skills"]
