# Harness profile: Hermes Agent (Nous Research).
id = "hermes"
name = "Hermes Agent"
kind = "cli"
autonomous = true  # runs as a gateway too: chat channels, cron jobs, memory
aliases = ["hermes-agent", "nous-hermes"]
vendor = "Nous Research"
homepage = "https://github.com/NousResearch/hermes-agent"
support = "full"
open-source = true
local-models = true
binaries = ["hermes"]
version = { args = ["--version"] }
active-env = ["HERMES_SESSION_ID", "HERMES_INTERACTIVE"]
config-root = { env = "HERMES_HOME", default = "~/.hermes" }
instructions = ["AGENTS.md", ".hermes.md", "{root}/SOUL.md"]

[[install]]
method = "script"
command = "curl -fsSL https://raw.githubusercontent.com/NousResearch/hermes-agent/main/scripts/install.sh | bash"
path-hints = ["/.hermes/", "/.local/bin/hermes"]

[files.config]
path = "{root}/config.yaml"
format = "yaml"
restore = "whole"

[model]
default = ["env:HERMES_MODEL", "config#/model/default"]
provider = ["env:HERMES_INFERENCE_PROVIDER", "config#/model/provider"]
base-url = ["config#/model/base_url"]

[mcp]
sources = ["config#/mcp_servers"]
write = "config#/mcp_servers"

[skills]
dirs = ["{root}/skills"]
write = "{root}/skills"
builtin-manifest = "{root}/skills/.bundled_manifest"

# The model Hermes's smart approvals use (`approvals.mode: smart`); a plugin such as
# jev-approvals points it at a decision model. `hlock pin` records it.
[deciders.approve]
native = { file = "config", pointer = "/auxiliary/approval", provider-key = "provider", model-key = "model", base-url-key = "base_url" }

[launch]
model-flag = "--model"
prompt = ["-z", "{prompt}"]  # `hlock run`: one prompt, non-interactively

# How `hlock localize` points this harness at a local OpenAI-compatible endpoint.
[[local-provider]]
file = "config"
set = { "/model/provider" = "custom", "/model/default" = "{model}", "/model/base_url" = "{base_url}" }
