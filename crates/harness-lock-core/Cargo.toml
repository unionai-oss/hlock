[package]
name = "harness-lock-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Core library for hlock (also published as harness-lock): manifest, lockfile, store, tuning."
readme = "../../README.md"
homepage = "https://github.com/unionai-oss/hlock"
keywords = ["agents", "llm", "lockfile", "evaluation", "flyte"]
categories = ["development-tools", "command-line-utilities"]

# Code-facing crate name stays `harness_lock_core` while the published (crates.io)
# name is `harness-lock-core`.
[lib]
name = "harness_lock_core"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
# The flyte-sdk-rs backend (optional — links libpython via flyte_core/pyo3 and is
# only compiled when the `flyte` feature is enabled).
flyte = { version = "0.1", optional = true }
serde_norway = "0.9.42"
# The built-in meta agent's model calls: a small blocking client with rustls (no async runtime).
# killpg / O_NOFOLLOW for the process runner and safe file reads
libc = "0.2"
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Version ranges over git tags and package versions (`hlock add …@^1.2`).
semver = "1"
# Editing harness.toml in place (`hlock add`, `hlock remove`), keeping comments and layout.
# Already in the build as the parser behind `toml`.
toml_edit = "0.22"

[features]
default = []
# Uses https://github.com/flyteorg/flyte-sdk-rs for durable, traced trial
# execution on a Flyte backend.
flyte = ["dep:flyte"]
