[workspace]
resolver = "2"
members = [
    "crates/harness-lock-core",
    "crates/harness-lock-py",
    "crates/harness-lock",
    "crates/hlock",
]
default-members = ["crates/harness-lock-core", "crates/harness-lock-py", "crates/harness-lock", "crates/hlock"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Niels Bantilan <niels.bantilan@gmail.com>"]
repository = "https://github.com/unionai-oss/hlock"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
anyhow = "1"
thiserror = "2"
pyo3 = { version = "0.24", features = ["extension-module", "abi3-py39"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
