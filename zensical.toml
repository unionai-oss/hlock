# Documentation site for hlock, built with Zensical (https://zensical.org).
#   uv run --group docs zensical serve           # http://localhost:8000, live reload
#   uv run --group docs zensical build --clean   # -> site/
# Published to GitHub Pages by .github/workflows/docs.yml.

[project]
site_name = "hlock"
site_description = "Your agent harness made portable. Pin your harness, models, MCP servers, skills, and config in a harness.lock, version it, and rehydrate it anywhere."
site_url = "https://docs.hlock.ai/"
site_author = "Union.ai"
repo_url = "https://github.com/unionai-oss/hlock"
repo_name = "unionai-oss/hlock"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; 2026 Union.ai · Apache-2.0"
extra_css = ["stylesheets/extra.css"]
extra_javascript = ["javascripts/terminal.js"]

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    "getting-started/installation.md",
    "getting-started/quickstart.md",
    "getting-started/apm.md",
  ] },
  { "Concepts" = [
    "concepts/index.md",
    "concepts/architecture.md",
    "concepts/related.md",
  ] },
  { "Guides" = [
    { "Lock your setup" = [
      "guides/harnesses.md",
      "guides/pin.md",
      "guides/dependencies.md",
      "guides/sync.md",
      "guides/launch.md",
      "guides/pull.md",
      "guides/teams.md",
      "guides/secrets.md",
      "guides/audit.md",
      "guides/diff.md",
    ] },
    { "Optimize your harness" = [
      "guides/eval-packs.md",
      "guides/deciders.md",
      "guides/resolve.md",
      "guides/tune.md",
      "guides/upgrade.md",
      "guides/backends.md",
      "guides/optimizers.md",
      "guides/ci.md",
    ] },
    { "Switch harnesses" = [
      "guides/migrate.md",
      "guides/localize.md",
    ] },
    { "Delegate to an agent" = [
      "guides/meta.md",
    ] },
    { "Extend" = [
      "guides/harness-profiles.md",
    ] },
  ] },
  { "Reference" = [
    "reference/cli.md",
    "reference/harnesses.md",
    "reference/python-api.md",
    "reference/rust-api.md",
    "reference/manifest.md",
    "reference/meta-manifest.md",
    "reference/lockfile.md",
    "reference/policy.md",
    "reference/environment.md",
  ] },
  { "Project" = [
    "project/development.md",
    "project/contributing.md",
    "project/releasing.md",
    "project/badge.md",
    { "Design specs" = "https://github.com/unionai-oss/hlock/tree/main/specs" },
  ] },
]

[project.theme]
language = "en"
custom_dir = "overrides"
logo = "assets/logo-animated.svg"
favicon = "assets/logo.svg"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "deep-purple"
accent = "pink"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "deep-purple"
accent = "pink"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.extra]
website = "https://www.hlock.ai"
analytics = { provider = "google", property = "G-80E0EPQCZM" }
social = [
  { icon = "fontawesome/brands/github", link = "https://github.com/unionai-oss/hlock" },
  { icon = "fontawesome/brands/python", link = "https://pypi.org/project/hlock/" },
  { icon = "fontawesome/brands/rust", link = "https://crates.io/crates/hlock" },
]

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.snippets = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
