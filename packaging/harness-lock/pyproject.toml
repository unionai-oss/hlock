# `harness-lock` is an alias for `hlock`. It contains no code of its own: it pins
# `hlock` to the exact same version, and `hlock` ships `import hlock`,
# `import harness_lock`, and the `hlock` and `harness-lock` commands.
#
# Don't edit the version or the pin by hand: `python scripts/set_version.py X.Y.Z`
# keeps both in step with the Cargo workspace version.

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "harness-lock"
version = "0.5.0"
description = "Alias for hlock: make your agent harness pinnable, portable, and tunable."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Niels Bantilan", email = "niels.bantilan@gmail.com" }]
keywords = ["agents", "evaluation", "llm", "lockfile", "tuning", "flyte"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["hlock==0.5.0"]

[project.optional-dependencies]
flyte = ["hlock[flyte]==0.5.0"]

[project.urls]
Homepage = "https://github.com/unionai-oss/hlock"
Documentation = "https://docs.hlock.ai/"
Source = "https://github.com/unionai-oss/hlock"
Issues = "https://github.com/unionai-oss/hlock/issues"

# Metadata-only wheel: the `hlock` and `harness_lock` packages come from `hlock`.
[tool.hatch.build.targets.wheel]
bypass-selection = true
