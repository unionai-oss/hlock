name: publish-python

# Publishes two PyPI names under the unionai-oss PyPI account, via trusted publishing:
#   hlock         the package (Rust core + PyO3 bindings, built with maturin); ships
#                 both `import hlock` and `import harness_lock`
#   harness-lock  the alias: a code-free package (packaging/harness-lock) that pins
#                 hlock==<same version>
# hlock publishes first, so `pip install harness-lock` never points at a missing release.
#
# Release: `python scripts/set_version.py X.Y.Z`, merge to main, then push tag vX.Y.Z.
# The version job refuses to continue unless the tag matches the Cargo workspace version.
#
# Manual runs default to a dry run: they build every wheel and the sdist, verify them,
# and stop before publishing. Set `dry_run: false` to publish from a manual run.
#
# One-time setup (see RELEASING.md):
#   - two GitHub environments: `pypi-hlock` (publishes hlock) and `pypi`
#     (publishes harness-lock)
#   - one PyPI trusted publisher per package name, added while logged in as the
#     unionai-oss PyPI account (as *pending* publishers before the first release, since
#     the projects don't exist yet): owner `unionai-oss`, repository `hlock`,
#     workflow `publish-python.yml`, and environment `pypi` for `harness-lock`,
#     `pypi-hlock` for `hlock`. Distinct environments keep the two publisher
#     configurations distinct, which PyPI requires of pending publishers.
# No API token is stored anywhere; each publish job's `id-token: write` authenticates.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify only — do not publish"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-python-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # A tag that disagrees with the version would publish a release nobody can
      # trace back to a commit, so fail loudly instead.
      - id: version
        name: Versions agree (and match the tag)
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION=$(python scripts/set_version.py --check "$GITHUB_REF_NAME")
          else
            VERSION=$(python scripts/set_version.py --check)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "building $VERSION"

  wheels:
    name: Wheel (${{ matrix.platform }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, os: ubuntu-latest, target: x86_64 }
          - { platform: linux-aarch64, os: ubuntu-latest, target: aarch64 }
          - { platform: macos-arm64, os: macos-15, target: aarch64 }
          - { platform: macos-x86_64, os: macos-15, target: x86_64 }
          - { platform: windows-x64, os: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # One abi3 wheel per platform covers CPython >= 3.9.
      - uses: PyO3/maturin-action@v1
        env:
          # ring (via ureq/rustls) needs __ARM_ARCH, which the manylinux2014 aarch64
          # cross gcc doesn't define. Only the aarch64-linux target reads this variable.
          CFLAGS_aarch64_unknown_linux_gnu: -D__ARM_ARCH=8
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: dist-wheel-${{ matrix.platform }}
          path: dist

  sdist:
    name: Source distribution
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist

  alias:
    name: harness-lock alias package
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build packaging/harness-lock --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: harness-lock-dist
          path: dist

  verify:
    name: Verify distributions
    needs: [version, wheels, sdist, alias]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: harness-lock-dist
          path: harness-lock-dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: twine check
        run: |
          python -m pip install --upgrade twine packaging
          ls -l dist harness-lock-dist
          twine check dist/* harness-lock-dist/*
      - name: Every expected artifact is present
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # PEP 440 normalizes pre-releases in filenames (0.2.0-rc.1 -> 0.2.0rc1).
          PY_VERSION=$(python -c "import os; from packaging.version import Version; print(Version(os.environ['VERSION']))")
          for pattern in \
            "hlock-${PY_VERSION}.tar.gz" \
            "hlock-${PY_VERSION}-*manylinux*x86_64*.whl" \
            "hlock-${PY_VERSION}-*manylinux*aarch64*.whl" \
            "hlock-${PY_VERSION}-*macosx*arm64*.whl" \
            "hlock-${PY_VERSION}-*macosx*x86_64*.whl" \
            "hlock-${PY_VERSION}-*win_amd64*.whl" \
            "../harness-lock-dist/harness_lock-${PY_VERSION}.tar.gz" \
            "../harness-lock-dist/harness_lock-${PY_VERSION}-py3-none-any.whl"; do
            compgen -G "dist/$pattern" > /dev/null || { echo "::error::missing dist/$pattern"; exit 1; }
          done
      - name: Install both names and smoke-test them
        run: |
          set -euo pipefail
          python -m venv /tmp/venv
          # Install the local wheel files by path: `--find-links` would let pip pick an
          # older same-version `harness-lock` from PyPI (the pre-rename package, which has
          # no `hlock` module) over the local alias.
          /tmp/venv/bin/pip install dist/hlock-*manylinux*x86_64*.whl harness-lock-dist/*.whl
          /tmp/venv/bin/hlock --version
          /tmp/venv/bin/harness-lock --version
          /tmp/venv/bin/python -c "import harness_lock, hlock; assert hlock.__version__ == harness_lock.__version__; print(hlock.__version__)"

  # Job ids and environments are per PyPI project: `pypi-hlock` publishes hlock, `pypi`
  # publishes harness-lock. Each must match that project's trusted publisher.
  pypi-hlock:
    name: Publish hlock to PyPI
    needs: [version, verify]
    if: github.event_name == 'push' || inputs.dry_run == false
    runs-on: ubuntu-latest
    environment: pypi-hlock
    permissions:
      id-token: write # PyPI trusted publishing — no API token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # Re-running a release tag should be a no-op, not a hard failure.
          skip-existing: true

  pypi:
    name: Publish harness-lock to PyPI
    needs: [pypi-hlock]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing — no API token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: harness-lock-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  release:
    name: GitHub release
    needs: [pypi-hlock, pypi]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*dist*"
          path: dist
          merge-multiple: true
      - name: Attach the published artifacts to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes --title "$GITHUB_REF_NAME" dist/* \
            || gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" dist/* --clobber
