name: ci

on:
  push:
    branches: [main, "rust-core", "v0.1-core"]
  pull_request:

permissions:
  contents: read

jobs:
  rust-core:
    name: Rust core (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build & test core
        run: cargo test -p harness-lock-core

  python-bindings:
    name: Python bindings (pytest + ruff)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.3.2
      # Same commands as docs/project/development.md: build the extension and
      # install the locked dev group, then test and lint.
      - name: Build & install (uv sync)
        run: uv sync --locked --python ${{ matrix.python-version }}
      - name: Unit tests
        run: uv run --no-sync pytest -q
      - name: Lint
        run: uv run --no-sync ruff check harness_lock hlock tests

  # Catches a broken release in review rather than at tag time: versions agree, the
  # wheel, sdist, and harness-lock alias build, pass `twine check`, install, and run, and
  # all three crates package.
  packaging:
    name: Packaging (version, wheels, crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Versions agree
        run: python scripts/set_version.py --check
      - uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist
          manylinux: auto
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Build the harness-lock alias package
        run: |
          python -m pip install --upgrade build
          python -m build packaging/harness-lock --outdir dist
      - name: twine check + install smoke test (both names)
        run: |
          set -euo pipefail
          python -m pip install --upgrade twine
          twine check dist/*
          python -m venv /tmp/venv
          # Install both local wheels by path (`harness-lock` pins hlock==<same version>).
          # `--find-links` would let pip pick an older same-version `harness-lock` from
          # PyPI (the pre-rename package, which has no `hlock` module) over the local alias.
          /tmp/venv/bin/pip install dist/*.whl
          # Run outside the checkout so the source `harness_lock/` and `hlock/` dirs (no
          # compiled extension) don't shadow the installed packages.
          cd "$RUNNER_TEMP"
          /tmp/venv/bin/hlock --version
          /tmp/venv/bin/harness-lock --version
          /tmp/venv/bin/python -c "import harness_lock, hlock; assert hlock.__version__ == harness_lock.__version__; print(hlock.__version__)"
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo publish --workspace --dry-run (harness-lock-core, hlock, harness-lock)
        run: cargo publish --workspace --dry-run --locked
