name: docs

# Builds the Zensical site (zensical.toml + docs/). Pushes to main deploy it to
# GitHub Pages at https://docs.hlock.ai/. Pull requests only
# build it, so a broken page fails review instead of the deploy.
#
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions",
# and Custom domain: docs.hlock.ai (DNS: CNAME docs → unionai-oss.github.io). With
# Actions-based Pages the domain lives in the repo settings, so there's no CNAME file.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "docs/**"
      - "zensical.toml"
      - "README.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.2
      # Only the locked docs group: Zensical doesn't need the Rust extension built.
      - name: Install Zensical
        run: uv sync --locked --only-group docs --python 3.12
      - name: Build
        run: uv run --no-sync zensical build --clean
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
